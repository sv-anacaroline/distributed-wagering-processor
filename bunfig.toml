# Bun 1.x is the sole test runner required by the technical challenge.
[test]
preload = ["./test/setup.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true
# Aggregate SQL-bound orchestration, events and integrations in test:cov:full.
# Unit-only coverage is reported separately and must not hide integration gaps.
coveragePathIgnorePatterns = ["**/*.spec.ts", "**/*.test.ts", "src/main.ts", "src/mikro-orm.config.ts"]
