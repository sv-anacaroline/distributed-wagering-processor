# Bun 1.x is the sole test runner required by the technical challenge.
[test]
preload = ["./test/setup.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageSkipTestFiles = true
# SQL-bound orchestration is covered by PostgreSQL E2E/integration tests, not pure-unit coverage.
coveragePathIgnorePatterns = ["**/*.spec.ts", "**/*.test.ts", "src/main.ts", "src/mikro-orm.config.ts", "src/application/process-wager.ts"]
coverageThreshold = { lines = 0.7, functions = 0.7 }
