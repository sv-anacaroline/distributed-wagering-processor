name: On-demand financial k6 benchmark (not a merge gate)

# The one-time branch bootstrap permits measuring this PR before merge. Once
# merged, this workflow is manual-only on master and is never a required check.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/test-coverage-k6
    paths:
      - .github/workflows/performance-benchmark.yml
      - scripts/run-performance.sh
      - docker-compose.yml

permissions:
  contents: read

concurrency:
  group: on-demand-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    name: Independent k6 financial benchmark (optional)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      K6_ENVIRONMENT: github-actions-ubuntu-24.04
      K6_VUS: "2"
      K6_DURATION: "8s"
      K6_STAGE_DURATION: "6s"
      K6_SOAK_DURATION: "20s"
      AWS_EMULATOR_IMAGE: ministackorg/ministack:1.5.40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Start PostgreSQL, SQS and real Keycloak without financial workers
        run: |
          docker compose --profile full up -d --build postgres aws-emulator terraform-local keycloak
          docker compose --profile full ps
      - name: Apply migrations to the fresh SQL database before any worker starts
        run: docker compose --profile full run --rm --no-deps api bun run db:migrate:up
      - name: Start real NestJS API and financial workers
        run: |
          docker compose --profile full up -d --build api wager-sqs-consumer wager-outbox-publisher reference-retry-worker
          docker compose --profile full ps
      - name: Wait for real OIDC and service dependencies
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/realms/wagering/.well-known/openid-configuration >/dev/null &&
               curl -fsS http://localhost:3000/health/ready >/dev/null; then
              echo "PostgreSQL, SQS, API and Keycloak ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile full ps
          exit 1
      - name: Measure six k6 scenarios against real authenticated HTTP APIs
        run: bash scripts/run-performance.sh
      - name: Upload complete JSON and logs (independent of test outcome)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-k6-performance
          path: performance/results
          if-no-files-found: warn
      - name: Capture failed service diagnostics
        if: failure()
        run: docker compose --profile full logs --tail=90 api postgres aws-emulator keycloak terraform-local || true
      - name: Shut down disposable benchmark environment
        if: always()
        run: docker compose --profile full down -v --remove-orphans
