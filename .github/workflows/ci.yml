name: CI and deploy preview

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint, format and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint with type-aware rules
        run: bun run lint
      - name: TypeScript strict typecheck
        if: success() || failure()
        run: bun run typecheck
      - name: Verify formatting
        if: success() || failure()
        run: bun run format:check
      - name: Print canonical telemetry formatting patch
        if: failure()
        run: |
          bun run format >/dev/null
          git diff --no-ext-diff -- src/telemetry

  quality:
    name: Unit, E2E, coverage and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqs:
        image: ministackorg/ministack:1.5.40
        ports:
          - 4566:4566
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health', timeout=2)\""
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_USER: wagering
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: ci_only_password
      HTTP_AUTH_MODE: disabled
      EVENTS_E2E: "1"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      SQS_ENDPOINT_URL: http://127.0.0.1:4566
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply versioned schema migrations
        run: bun run db:migrate:up
      - name: Unit tests
        run: bun run test
      - name: E2E tests with PostgreSQL
        run: bun run test:e2e
      - name: Unit-only coverage report
        run: |
          bun run test:cov:unit
          mkdir -p artifacts/coverage/unit
          cp coverage/lcov.info artifacts/coverage/unit/lcov.info
          bun scripts/coverage-report.ts unit artifacts/coverage/unit/lcov.info artifacts/coverage/unit/report.md
      - name: Fresh isolated PostgreSQL for deterministic combined coverage
        run: |
          bun scripts/prepare-coverage-db.ts
          DB_NAME=wagering_coverage bun run db:migrate:up
      - name: Combined unit, E2E and integration coverage
        run: |
          DB_NAME=wagering_coverage bun run test:cov:full
          mkdir -p artifacts/coverage/integrated
          cp coverage/lcov.info artifacts/coverage/integrated/lcov.info
          bun scripts/coverage-report.ts integrated artifacts/coverage/integrated/lcov.info artifacts/coverage/integrated/report.md --enforce
      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-test-coverage
          path: artifacts/coverage
          if-no-files-found: warn
      - name: Build NestJS
        run: bun run build
      - name: Validate MikroORM PostgreSQL connectivity
        run: bun run db:debug
      - name: Inspect pending migrations
        run: bun run db:migrate:pending
      - name: Verify schema rollback and reapply on disposable CI database
        run: |
          bun run db:migrate:down
          bun run db:migrate:up

  auth-idp:
    name: Keycloak OIDC real-token E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_USER: wagering
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: ci_only_password
      HTTP_AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8080/realms/wagering
      OIDC_JWKS_URL: http://localhost:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_AUDIENCE: wagering-api
      OIDC_METRICS_CLIENT_ID: wagering-monitor
      OIDC_PROVIDER_CLIENT_IDS: provider-a,provider-b
      KEYCLOAK_BASE_URL: http://localhost:8080
      AUTH_E2E: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Apply versioned database migrations
        run: bun run db:migrate:up
      - name: Start real Keycloak with imported demo realm
        run: docker compose --profile auth up -d keycloak
      - name: Wait for Keycloak OIDC discovery
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/realms/wagering/.well-known/openid-configuration > /dev/null; then
              echo "Keycloak realm ready"
              exit 0
            fi
            sleep 2
          done
          docker compose --profile auth logs keycloak
          exit 1
      - name: Authenticate two real providers and assert HTTP isolation
        run: bun run test:auth:e2e
      - name: Shutdown development IdP
        if: always()
        run: docker compose --profile auth down --remove-orphans

  deploy-preview:
    name: Simulate AWS deployment (no changes)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint-and-types, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Preview deployment plan
        run: |
          echo "DRY RUN ONLY — no AWS credentials, Terraform apply or kubectl actions."
          echo "1. Authenticate to AWS via GitHub OIDC (future)"
          echo "2. Terraform plan for infra/terraform/aws (future)"
          echo "3. Build Bun container, push to ECR (future)"
          echo "4. Run migrations once, before EKS rollout (future)"
          echo "5. Terraform plan for infra/terraform/eks-app (future)"
          echo "6. EKS rollout, readiness verification and smoke tests (future)"
          echo "Commit: ${{ github.sha }}"
