name: CI and deploy preview

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint, format and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint with type-aware rules
        run: bun run lint
      - name: TypeScript strict typecheck
        if: success() || failure()
        run: bun run typecheck
      - name: Verify formatting
        if: success() || failure()
        run: bun run format:check
      - name: Inspect final strict-error Prettier adjustments (temporary)
        if: always()
        run: |
          bunx --bun prettier --write src/events/sqs-wager-consumer.spec.ts src/http/http-exception.filter.ts src/http/http-exception.filter.spec.ts
          for file in src/events/sqs-wager-consumer.spec.ts src/http/http-exception.filter.ts src/http/http-exception.filter.spec.ts; do
            echo "__BEGINFILE__${file}"
            base64 -w 120 "$file" | sed 's/^/__FILECHUNK__/'
            echo "__ENDFILE__${file}"
          done

  quality:
    name: Unit, E2E, coverage and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqs:
        image: ministackorg/ministack:1.5.40
        ports:
          - 4566:4566
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_ministack/health', timeout=2)\""
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wagering
          POSTGRES_USER: wagering
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wagering -d wagering"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: ci_only_password
      HTTP_AUTH_MODE: disabled
      EVENTS_E2E: "1"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      SQS_ENDPOINT_URL: http://127.0.0.1:4566
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply versioned schema migrations
        run: bun run db:migrate:up
      - name: Unit tests
        run: bun run test
      - name: E2E tests with PostgreSQL
        run: bun run test:e2e
      - name: Coverage threshold
        run: bun run test:cov
      - name: Build NestJS
        run: bun run build
      - name: Validate MikroORM PostgreSQL connectivity
        run: bun run db:debug
      - name: Inspect pending migrations
        run: bun run db:migrate:pending
      - name: Verify schema rollback and reapply on disposable CI database
        run: |
          bun run db:migrate:down
          bun run db:migrate:up

  k6-config:
    name: Validate k6 scenario configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.k6.yml config --quiet
      - name: Inspect all k6 scenarios without generating traffic
        run: |
          for scenario in smoke load stress spike soak; do
            docker run --rm \
              -v "$PWD/performance:/scripts:ro" \
              -e "K6_SCENARIO=$scenario" \
              grafana/k6:1.8.2 inspect "/scripts/scenarios/$scenario.js" > /dev/null
          done

  deploy-preview:
    name: Simulate AWS deployment (no changes)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint-and-types, quality, k6-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Preview deployment plan
        run: |
          echo "DRY RUN ONLY — no AWS credentials, Terraform apply or kubectl actions."
          echo "1. Authenticate to AWS via GitHub OIDC (future)"
          echo "2. Terraform plan for infra/terraform/aws (future)"
          echo "3. Build Bun container, push to ECR (future)"
          echo "4. Run migrations once, before EKS rollout (future)"
          echo "5. Terraform plan for infra/terraform/eks-app (future)"
          echo "6. EKS rollout, readiness verification and smoke tests (future)"
          echo "Commit: ${{ github.sha }}"
