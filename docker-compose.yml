name: distributed-wagering-processor

x-app-env: &app-env
  NODE_ENV: development
  PORT: "3000"
  HTTP_AUTH_MODE: ${HTTP_AUTH_MODE:-oidc}
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/wagering}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/wagering/protocol/openid-connect/certs}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-wagering-api}
  OIDC_METRICS_CLIENT_ID: ${OIDC_METRICS_CLIENT_ID:-wagering-monitor}
  OIDC_PROVIDER_CLIENT_IDS: ${OIDC_PROVIDER_CLIENT_IDS:-provider-a,provider-b}
  PAGINATION_CURSOR_SECRET: ${PAGINATION_CURSOR_SECRET:-local-only-not-for-production}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-wagering}
  DB_USER: ${POSTGRES_USER:-wagering}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_ENDPOINT_URL: http://aws-emulator:4566
  SQS_WAGER_TRANSACTIONS_QUEUE_NAME: wager-transactions.fifo
  SQS_WAGER_TRANSACTIONS_DLQ_NAME: wager-transactions-dlq.fifo
  SQS_WAGER_EVENTS_QUEUE_NAME: wager-events.fifo

services:
  keycloak:
    profiles: [auth, full]
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:${KEYCLOAK_PORT:-8080}"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-admin-change-me}
      KEYCLOAK_PROVIDER_A_SECRET: ${KEYCLOAK_PROVIDER_A_SECRET:-local-provider-a-change-me}
      KEYCLOAK_PROVIDER_B_SECRET: ${KEYCLOAK_PROVIDER_B_SECRET:-local-provider-b-change-me}
      KEYCLOAK_MONITOR_SECRET: ${KEYCLOAK_MONITOR_SECRET:-local-monitor-change-me}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
      - keycloak_dev_data:/opt/keycloak/data
    restart: unless-stopped

  api:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      terraform-local:
        condition: service_completed_successfully
    restart: unless-stopped

  # Compose profile for three app processes: api + two replicas.
  api-replica:
    profiles: [distributed]
    build:
      context: .
      target: production
    init: true
    environment:
      <<: *app-env
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      terraform-local:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional scheduled DB worker; no SQS, API or outbox publisher involved.
  reference-retry-worker:
    profiles: [reference-worker, full]
    build:
      context: .
      target: development
    init: true
    command: ["bun", "run", "worker:references"]
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Section 10: SQS FIFO consumer (Inbox+financial SQL commit before ACK).
  wager-sqs-consumer:
    profiles: [sqs-workers, full]
    build:
      context: .
      target: development
    init: true
    command: ["bun", "run", "worker:sqs"]
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      terraform-local:
        condition: service_completed_successfully
    restart: unless-stopped

  # Section 11: outbox publisher; can be scaled horizontally.
  wager-outbox-publisher:
    profiles: [sqs-workers, full]
    build:
      context: .
      target: development
    init: true
    command: ["bun", "run", "worker:outbox"]
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      terraform-local:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # MiniStack works without credentials; LocalStack remains selectable with its auth token.
  aws-emulator:
    image: ${AWS_EMULATOR_IMAGE:-ministackorg/ministack:1.5.40}
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${SQS_PORT:-4566}:4566"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          import sys
          for endpoint in ('_localstack/health', '_ministack/health'):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4566/' + endpoint, timeout=3)
                  sys.exit(0)
              except Exception:
                  pass
          sys.exit(1)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  terraform-local:
    image: hashicorp/terraform:1.13.5
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # The Terraform source is read-only; init needs a writable directory
        # to write its provider lockfile. Keep generated files out of Git.
        mkdir -p /tmp/terraform-local
        cp -R /infra/. /tmp/terraform-local/
        terraform -chdir=/tmp/terraform-local init -input=false
        terraform -chdir=/tmp/terraform-local apply -auto-approve -input=false
    volumes:
      - ./infra/terraform/local:/infra:ro
      - terraform_local_state:/state
      - terraform_local_plugins:/plugins
    environment:
      TF_DATA_DIR: /plugins
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${AWS_REGION:-us-east-1}
      TF_VAR_sqs_endpoint: http://aws-emulator:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      aws-emulator:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  api_node_modules:
  terraform_local_state:
  terraform_local_plugins:
  keycloak_dev_data:
