services:
  k6:
    image: grafana/k6:1.8.2
    profiles: [performance]
    volumes:
      - ./performance:/scripts:ro
    environment:
      BASE_URL: http://api:3000
      K6_VUS: ${K6_VUS:-5}
      K6_DURATION: ${K6_DURATION:-15s}
    entrypoint: ["k6"]
    command: ["run", "/scripts/smoke.js"]
    depends_on:
      api:
        condition: service_started
