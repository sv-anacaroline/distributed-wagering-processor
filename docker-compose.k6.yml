services:
  k6:
    image: grafana/k6:1.8.2
    profiles: [performance]
    user: "${K6_UID:-1000}:${K6_GID:-1000}"
    volumes:
      - ./performance:/scripts:ro
      - ./performance/results:/results
    environment:
      BASE_URL: ${K6_BASE_URL:-http://api:3000}
      K6_VUS: ${K6_VUS:-5}
      K6_DURATION: ${K6_DURATION:-15s}
      K6_STAGE_DURATION: ${K6_STAGE_DURATION:-30s}
      K6_SOAK_DURATION: ${K6_SOAK_DURATION:-10m}
      K6_P95_MS: ${K6_P95_MS:-}
      K6_ENVIRONMENT: ${K6_ENVIRONMENT:-local}
      K6_SCENARIO: ${K6_SCENARIO:-smoke}
      K6_AUTH_MODE: ${K6_AUTH_MODE:-oidc}
      K6_OIDC_TOKEN_URL: ${K6_OIDC_TOKEN_URL:-http://keycloak:8080/realms/wagering/protocol/openid-connect/token}
      K6_OIDC_CLIENT_ID: ${K6_OIDC_CLIENT_ID:-provider-a}
      K6_OIDC_CLIENT_SECRET: ${K6_OIDC_CLIENT_SECRET:-local-provider-a-change-me}
      K6_AUTH_TOKEN: ${K6_AUTH_TOKEN:-}
      K6_OIDC_MONITOR_CLIENT_ID: ${K6_OIDC_MONITOR_CLIENT_ID:-wagering-monitor}
      K6_OIDC_MONITOR_CLIENT_SECRET: ${K6_OIDC_MONITOR_CLIENT_SECRET:-local-monitor-change-me}
      K6_MONITOR_AUTH_TOKEN: ${K6_MONITOR_AUTH_TOKEN:-}
    entrypoint: ["k6"]
    command: ["run", "/scripts/scenarios/smoke.js"]
    depends_on:
      api:
        condition: service_started
